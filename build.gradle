plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.twitchchat'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.172'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        twitchchat {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // NeoForge already included via plugin
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
